<!-- partials/friend_result.html -->
{% if searched_user %}
  <div class="card">
    <div class="card-body d-flex justify-content-between align-items-center">
      <div id="searched_user">
        <h5 class="card-title mb-0">{{ searched_user.username }}</h5>
        <small class="text-muted">Friend Code: {{ searched_user.friend_code }}</small>
      </div>
          <form
              hx-post="#"
              hx-target="#searched_user"
              hx-swap="innerHTML"
          >
              {% csrf_token %}
              <button type="button" class="btn btn-sm btn-primary">
      Send Request
              </button>
          </form>
    </div>
  </div>
{% else %}
  <p class="text-muted">No user found with that friend code.</p>
{% endif %}
