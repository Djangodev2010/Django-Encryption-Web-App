{% for request in pending_requests %}
<li id="request_{{ request.id }}" class="list-group-item d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center">
  <div class="mb-2 mb-md-0">
    <span style="font-family: 'Segoe UI', sans-serif; font-weight: 600;">
      {{ request.friend.username }}
    </span>
    <span style="font-family: 'Courier New', monospace; font-size: 0.9em;" class="ms-2 text-muted">
      ({{ request.friend.friend_code }})
    </span>
  </div>
  <div class="d-flex align-items-center">
    <span class="badge bg-warning text-dark me-2">Pending</span>
    <form 
      method="POST"
      action="{% url 'chats:accept_friend_request' request.id %}"
      hx-post="{% url 'chats:accept_friend_request' request.id %}"
      hx-target="#request_{{ request.id }}"
      hx-swap="outerHTML"
    >
      {% csrf_token %}
      <button type="submit" class="btn btn-success btn-sm">Accept</button>
    </form>
  </div>
</li>
{% endfor %}
