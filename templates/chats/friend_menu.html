{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-4">
  <h2 class="mb-3">Find Friends</h2>

  <!-- Search Form with HTMX -->
      <form>
        <input type="search" class="form-control" name="friend_code" placeholder="Type A Friend Code To Connect!" aria-label="Search" />
        <button class="btn btn-success" type="button"
                hx-get="{% url 'chats:search_friend_request' %}"
                hx-target="#friend_request"
                hx-include="[name='friend_code']"
                hx-swap="innerHTML">
          Search
        </button>
      </form>
      
  <!-- Friend Request Search Results -->
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div id="friend_request" class="mt-3">
        {% include 'chats/partials/friend_request_search_partials.html' %}
      </div>
    </div>
  </div>

  <!-- Pending Friend Requests -->
  <div class="mt-5">
    <h4>Pending Friend Requests</h4>
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8">
        <div class="mt-3" id="pending_requests">
          {% include 'chats/partials/pending_requests_partials.html' %}
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
