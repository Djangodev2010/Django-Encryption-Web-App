{% if searched_user %}
  <div id="user-card">
    <div class="card">
      <div class="card-body d-flex justify-content-between align-items-center">
        <div>
          <h5 class="card-title mb-0">{{ searched_user.username }}</h5>
          <small class="text-muted">Friend Code: {{ searched_user.friend_code }}</small>
        </div>

        {% if not already_friend %}
          <form
              hx-post="{% url 'chats:send_friend_request' searched_user.id %}"
              hx-target="#user-card"
              hx-swap="outerHTML"
          >
              {% csrf_token %}
              <button type="submit" class="btn btn-sm btn-primary">
                Send Request
              </button>
          </form>
        {% endif %}
      </div>
    </div>
  </div>
{% else %}
  <p class="text-muted">No user found with that friend code.</p>
{% endif %}
