<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chats</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    #chat-container {
      padding-bottom: 100px; /* Prevent overlap with input bar */
      overflow-y: auto;
      max-height: calc(100vh - 200px);
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary fixed-top">
    <div class="container-fluid">
      <a href="{% url 'chats:index' %}" class="navbar-brand bg-success text-white px-3 py-1 rounded">Chats</a>
    </div>
  </nav>

  <!-- Friend Header -->
  <div class="text-center mt-5 pt-4 mb-3">
    <span class="bg-light px-4 py-2 rounded-pill d-inline-block">
      <h1 class="fs-3 mb-0">{{ friend_username }}</h1>
    </span>
  </div>

  <!-- Chat Messages -->
  <div id="chat-container" class="container-fluid px-3 px-md-5 mb-5">
    {% for chat in chats %}
      {% include 'chats/partials/text_partial.html' %}
    {% endfor %}
  </div>

  <!-- Message Input Form -->
  <form 
    method="POST"
    action="{% url 'chats:send_message' friend_id %}"
    id="message-form"
    class="fixed-bottom bg-white p-2 border-top"
  >
    {% csrf_token %}
    <div class="container">
      <div class="row">
        <div class="col-9 col-sm-10">
          <input type="text" name="text" class="form-control rounded-pill" id="message-input" placeholder="Type a message..." required>
        </div>
        <div class="col-3 col-sm-2 d-grid">
          <button class="btn btn-success rounded-pill" type="submit">Send</button>
        </div>
      </div>
    </div>
  </form>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script>
    $('#message-form').on('submit', function(e) {
      e.preventDefault();
      const message = $('#message-input').val();
      const csrfToken = $('input[name="csrfmiddlewaretoken"]').val();

      $.ajax({
        type: 'POST',
        url: "{% url 'chats:send_message' friend_id %}",
        data: {
          'text': message,
          'csrfmiddlewaretoken': csrfToken
        },
        success: function(response) {
          $('#message-input').val('');
          $('#chat-container').append(response.html);
          const container = document.getElementById('chat-container');
          container.scrollTop = container.scrollHeight;
        },
        error: function() {
          alert('Message failed to send.');
        }
      });
    });
  </script>
</body>
</html>
